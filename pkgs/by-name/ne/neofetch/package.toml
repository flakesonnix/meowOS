format_version = 1
name = "neofetch"
version = "7.1.0"
architecture = "AMD64"
description = "A command-line system information tool written in bash"
license = "MIT"
depends = ["bash"]

[source]
url = "https://github.com/dylanaraps/neofetch/archive/refs/tags/7.1.0.tar.gz"
sha256 = "58a95e6b714e41efc804eca389a223309169b2def35e57fa934482a6b47c27e7"

[phases]
install = '''
mkdir -p "${out}/usr/bin"
install -m 755 "${src}/neofetch" "${out}/usr/bin/neofetch"
'''
