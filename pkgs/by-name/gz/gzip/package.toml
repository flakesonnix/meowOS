format_version = 1
name = "gzip"
version = "1.14"
architecture = "AMD64"
description = "GNU gzip - compression utility"
license = "GPL-3.0-or-later"
depends = ["glibc"]
[source]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.14.tar.xz"
sha256 = "01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6"
[phases]
configure = '''
mkdir -p "${build}"
cd "${build}"
"${src}/configure" \
    --prefix=/usr \
    --host=x86_64-pc-linux-gnu \
    --disable-nls
'''
build = '''
cd "${build}"
make -j"${MEOW_JOBS}"
'''
install = '''
cd "${build}"
make DESTDIR="${out}" install
'''
