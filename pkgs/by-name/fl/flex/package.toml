format_version = 1
name = "flex"
version = "2.6.4"
architecture = "AMD64"
description = "Fast lexical analyzer generator"
license = "BSD"
depends = [
    "m4",
    "gcc",
    "glibc",
    "make"
]
[source]
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"
[phases]
configure = '''
mkdir -p "${build}"
cd "${build}"
"${src}/configure" \
  --prefix=/usr \
  --host=x86_64-pc-linux-gnu \
  --disable-nls
'''
build = '''
cd "${build}"
make -j"${MEOW_JOBS}"
'''
install = '''
cd "${build}"
make DESTDIR="${out}" install
'''
[build]
reproducible = true
source_date_epoch = 1721520000