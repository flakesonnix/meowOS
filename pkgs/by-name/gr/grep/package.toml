format_version = 1
name = "grep"
version = "3.11"
architecture = "AMD64"
description = "GNU grep - print lines matching a pattern"
license = "GPL-3.0-or-later"
depends = ["glibc"]
[source]
url = "https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz"
sha256 = "1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab"
[phases]
configure = '''
mkdir -p "${build}"
cd "${build}"
"${src}/configure" \
    --prefix=/usr \
    --host=x86_64-pc-linux-gnu \
    --disable-perl-regexp \
    --disable-nls
'''
build = '''
cd "${build}"
make -j"${MEOW_JOBS}"
'''
install = '''
cd "${build}"
make DESTDIR="${out}" install
'''
