format_version = 1
name = "perl"
version = "5.38.2"
architecture = "AMD64"

description = "Highly capable, feature-rich programming language"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"

depends = [
    "gcc",
    "glibc",
    "make",
    "flex",
    "m4"
]

[source]
url = "https://www.cpan.org/src/5.0/perl-5.38.2.tar.gz"
sha256 = "a0a31534451eb7b83c7d6594a497543a54d488bc90ca00f5e34762577f40655e"

[phases]
configure = '''
_SYSROOT="/tmp/meow-install"
export CC="gcc --sysroot=$_SYSROOT"
export CFLAGS="-O2 -fwrapv -fno-strict-aliasing -pipe -fstack-protector-strong -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
export LDFLAGS="-fstack-protector-strong"

cd "${src}"

# Write a complete config.sh with all answers pre-filled
cat > config.sh << 'EOF'
cc='gcc --sysroot=/tmp/meow-install'
ccflags='-O2 -fwrapv -fno-strict-aliasing -pipe -fstack-protector-strong -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64'
ld='gcc --sysroot=/tmp/meow-install'
ldflags='-fstack-protector-strong'
prefix='/usr'
use64bitall='define'
useshrplib='define'
usesoname='define'
vendorprefix='/usr'
optimize='-O2'
usesitecustomize='define'
usevendorprefix='define'
usethreads='undef'
usemultiplicity='undef'
useperlio='define'
uselargefiles='define'
usesocks='undef'
usequadmath='undef'
userelocatableinc='undef'
archname='x86_64-linux'
myarchname='x86_64-linux'
libperl='libperl.so'
libpth='/usr/lib'
glibpth='/usr/lib'
incpth='/usr/include'
siteprefix='/usr'
sitelib='/usr/lib/perl5/site_perl/5.38.2'
sitearch='/usr/lib/perl5/site_perl/5.38.2/x86_64-linux'
vendorlib='/usr/lib/perl5/vendor_perl/5.38.2'
vendorarch='/usr/lib/perl5/vendor_perl/5.38.2/x86_64-linux'
privlib='/usr/lib/perl5/5.38.2'
archlib='/usr/lib/perl5/5.38.2/x86_64-linux'
scriptdir='/usr/bin'
sitescript='/usr/bin'
vendorscript='/usr/bin'
man1dir='/usr/share/man/man1'
man3dir='/usr/share/man/man3'
man1ext='1'
man3ext='3'
pager='/usr/bin/less -R'
cccdlflags='-fPIC'
ccdlflags='-Wl,-E'
lddlflags='-shared -O2 -fstack-protector-strong'
dlsrc='dl_dlopen.xs'
dlext='so'
d_dosuid='undef'
d_setlocale_r='undef'
d_setpgid='define'
d_sockatmark='define'
d_strerror_r='define'
d_strcoll='define'
d_strxfrm='define'
d_tzname='define'
d_vfork='undef'
d_vprintf='define'
d_printf='define'
d_sprintf='define'
usemymalloc='undef'
usemallocwrap='define'
usedl='define'
d_dlopen='define'
d_gnulibc='define'
d_gnulibc2='define'
gccversion='15.2.0'
gccosandvers='linux-6.18.33'
myuname='linux omen 6.18.33 x86_64'
cf_by='meow'
cf_email='meow@kitty.linux'
EOF

# Run Configure with script for TTY, provide Enter for "edit config_sh" then n for "make depend"
printf "\nn\n" | script -q -c "sh Configure -d -Dprefix=/usr" /dev/null

# Run make depend to generate dependencies
make depend

# Build in source directory
make -j"${MEOW_JOBS}"

# Install to out directory
make DESTDIR="${out}" install

# Remove perllocal.pod and .packlist files
find "${out}" -name perllocal.pod -delete
find "${out}" -name .packlist -delete

# Remove empty directories
find "${out}" -type d -empty -delete
'''
build = '''
# Build is done in configure phase
true
'''
install = '''
# Install is done in configure phase
true
'''

[build]
reproducible = true
source_date_epoch = 1721520000