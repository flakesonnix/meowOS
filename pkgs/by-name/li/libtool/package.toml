format_version = 1
name = "libtool"
version = "2.4.7"
architecture = "AMD64"

description = "Generic library support script"
license = "GPL-2.0-or-later"

depends = [
    "autoconf",
    "automake",
    "m4",
    "gcc",
    "glibc"
]

[source]
url = "https://ftp.gnu.org/gnu/libtool/libtool-2.4.7.tar.xz"
sha256 = "4f7f217f057ce655ff22559ad221a0fd8ef84ad1fc5fcb6990cecc333aa1635d"

[phases]
configure = '''
_SYSROOT="/tmp/meow-install"
export CC="gcc --sysroot=$_SYSROOT"
export CFLAGS="-O2"

cd "${build}"
"${src}/configure" \
  --prefix=/usr \
  --host=x86_64-pc-linux-gnu
'''
build = '''
_SYSROOT="/tmp/meow-install"
export CC="gcc --sysroot=$_SYSROOT"
export CFLAGS="-O2"

cd "${build}"
make -j"${MEOW_JOBS}"
'''
install = '''
cd "${build}"
make DESTDIR="${out}" install
'''

[build]
reproducible = true
source_date_epoch = 1721520000