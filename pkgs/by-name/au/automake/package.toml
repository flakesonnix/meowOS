format_version = 1
name = "automake"
version = "1.17"
architecture = "AMD64"
description = "GNU Makefile generator"
license = "GPL-3.0-or-later"
depends = [
    "perl",
    "autoconf"
]
[source]
url = "https://ftp.gnu.org/gnu/automake/automake-1.17.tar.xz"
sha256 = "8920c1fc411e13b90bf704ef9db6f29d540e76d232cb3b2c9f4dc4cc599bd990"
[phases]
configure = '''
cd "${build}"
"${src}/configure" \
  --prefix=/usr \
  --host=x86_64-pc-linux-gnu
'''
build = '''
cd "${build}"
make -j"${MEOW_JOBS}"
'''
install = '''
cd "${build}"
make DESTDIR="${out}" install
'''
[build]
reproducible = true
source_date_epoch = 1721520000