format_version = 1
name = "m4"
version = "1.4.21"
architecture = "AMD64"
description = "GNU m4 - macro processor"
license = "GPL-3.0-or-later"
depends = ["glibc"]
[source]
url = "https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.xz"
sha256 = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
[phases]
configure = '''
mkdir -p "${build}"
cd "${build}"
"${src}/configure" \
    --prefix=/usr \
    --host=x86_64-pc-linux-gnu \
    --disable-nls
'''
build = '''
cd "${build}"
make -j"${MEOW_JOBS}"
'''
install = '''
cd "${build}"
make DESTDIR="${out}" install
'''