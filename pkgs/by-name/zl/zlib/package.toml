format_version = 1
pname = "zlib"
version = "1.3.2"
architecture = "AMD64"

depends = ["glibc"]

[source]
url = "https://zlib.net/zlib-1.3.2.tar.xz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

