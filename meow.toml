# meowOS configuration

[repositories]
# Default repository - local filesystem or HTTP
# repository = "file:///path/to/repo"
# Multiple repositories with priority:
# [[repositories]]
# id = "main"
# url = "file:///path/to/repo"
# priority = 10

# Working directory for builds, source cache, package output, and install root.
# Override via MEOW_TMPDIR environment variable. Default: /var/tmp/meow
# workdir = "/var/tmp/meow"

[security]
# Require repository signature verification
require_repository_signature = false
# Require package index signature verification
require_package_index = false

[build]
# Number of parallel download workers (0 = auto)
download_workers = 0

[hooks]
# Hook execution timeout in seconds
timeout = 300
# Allow network access in hooks (advisory)
network = false
# Inherit environment variables
inherit_environment = false
